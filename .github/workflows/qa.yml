name: TaskFlow QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  developer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test

  api-qa:
    runs-on: ubuntu-latest
    needs: developer-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 qa/agents/generate_scenarios.py --input qa/requirements/SCRUM-6.json --output qa/scenarios/SCRUM-6.json
      - run: python3 qa/agents/approve_scenarios.py --input qa/scenarios/SCRUM-6.json --output qa/scenarios/approved/SCRUM-6.json --reviewed-by ci-review
      - run: npm run test:qa
      - if: always()
        run: npm run qa:analyze
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-qa-results
          path: qa/reports/